name: PM Scanner Hourly Check

on:
  schedule:
    # Runs every 15 minutes. The script checks which cities are within
    # their 2-hour trigger window, so running frequently just ensures
    # we don't miss a window due to GitHub's scheduling delays.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # allows manual "Run workflow" button in GitHub UI for testing

permissions:
  contents: write   # needed to commit the updated alerted.json state file

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scan
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BET_SIZE: '25'
        run: node scan.js

      - name: Commit updated alert state
        run: |
          git config user.name "pm-scanner-bot"
          git config user.email "actions@github.com"
          git add alerted.json
          git diff --staged --quiet || git commit -m "Update alerted signals state [skip ci]"
          git push
