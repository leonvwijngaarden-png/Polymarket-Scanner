name: PM Scanner Hourly Check

on:
  schedule:
    # Runs at the top of every hour (UTC). The script itself decides
    # which cities are actually "due" (2hrs before their local high)
    # so this can run every hour safely without spamming.
    - cron: '0 * * * *'
  workflow_dispatch: {}   # allows manual "Run workflow" button in GitHub UI for testing

permissions:
  contents: write   # needed to commit the updated alerted.json state file

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scan
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BET_SIZE: '25'
        run: node scan.js

      - name: Commit updated alert state
        run: |
          git config user.name "pm-scanner-bot"
          git config user.email "actions@github.com"
          git add alerted.json
          git diff --staged --quiet || git commit -m "Update alerted signals state [skip ci]"
          git push
